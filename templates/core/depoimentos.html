{% extends "base.html" %}
{% block content %}
{% include "partials/page_hero.html" with hero=page.s.hero %}

<section class="px-5 py-20 lg:px-8 lg:py-28">
  <div class="mx-auto max-w-7xl">
    <div class="grid gap-6 md:grid-cols-2">
      {% for t in testimonials %}<figure class="surface-card border border-border/60 p-8"><blockquote class="font-display text-xl leading-relaxed text-primary">“{{ t.quote }}”</blockquote><figcaption class="mt-6 border-t border-border pt-5 text-sm text-muted-foreground"><strong class="font-semibold text-foreground">{{ t.name }}</strong> · {{ t.origin }}<br>{{ t.treatment }}</figcaption></figure>{% endfor %}
    </div>
  </div>
</section>

{% include "partials/cta.html" %}
{% endblock %}
